name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: ["integracija/**"]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provjera:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      # DEMO vrijednosti. PROD ključevi ne smiju postojati u ovom workflow-u.
      #
      # Fallback nije kozmetika: Dependabot PR-ovi ne dobijaju Actions secrets (GitHub
      # ih drži u zasebnom Dependabot skupu), pa `secrets.DEMO_*` tamo dođe prazan.
      # `lib/env.ts` je zod-validiran i baca na import, a od Next 16.2.11 „collecting
      # page data" evaluira rute pri build-u — bez ovoga svaki Dependabot PR pada na
      # `pnpm build` (vidi PR #70). Placeholder je dovoljan jer gate nikad ne zove
      # Supabase: gradi, ne izvršava upite.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      ZAPISNIK_DRY_RUN: "1"
      CHAT_DRY_RUN: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          # provjeri:integraciju radi `git diff origin/main...HEAD` — plitki klon
          # (podrazumijevani fetch-depth: 1) ostavlja origin/main nerazrešiv i
          # skripta bi izašla kodom 2. Puna historija je obavezna.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: provjera tipova
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: statičke provjere integracije
        run: pnpm provjeri:integraciju

      - name: unit testovi
        run: pnpm test:unit

      - name: izgradnja
        run: pnpm build
